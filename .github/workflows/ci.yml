name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Régénérer les images de référence des tests visuels"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, tests unitaires, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  visual:
    name: Tests visuels (Playwright + SwiftShader)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Tests visuels
        if: ${{ !inputs.update_snapshots }}
        run: npx playwright test
      - name: Régénérer les images de référence
        if: ${{ inputs.update_snapshots }}
        run: npx playwright test --update-snapshots
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.update_snapshots }}
        with:
          name: snapshots
          path: tests/visual/**/*-snapshots/
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
